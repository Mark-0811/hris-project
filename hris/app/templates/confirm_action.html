{% extends "modal_form_base.html" %}
{% set cancel_url = cancel_url %}
{% block modal_body %}
<div class="form-section">
  <div class="mb-4">
    <h5 class="mb-2">{{ confirm_heading }}</h5>
    <p class="text-muted mb-0">{{ confirm_message }}</p>
  </div>
  <form method="post" action="{{ form_action }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% for key, value in hidden_fields.items() %}
    <input type="hidden" name="{{ key }}" value="{{ value }}">
    {% endfor %}
    <div class="d-flex gap-2 flex-wrap">
      <button class="btn btn-primary" type="submit">{{ confirm_button_label }}</button>
      <a class="btn btn-light-secondary" href="{{ cancel_url }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
