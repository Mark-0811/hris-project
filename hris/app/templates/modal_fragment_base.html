<div class="modal-content modal-form-content" data-modal-size="{{ modal_size|default('modal-lg') }}">
  <div class="modal-header">
    <div>
      <h4 class="modal-title mb-1">{{ page_title }}</h4>
      {% if modal_intro %}
      <p class="text-muted mb-0">{{ modal_intro }}</p>
      {% endif %}
    </div>
    <a class="btn-close" href="{{ cancel_url }}" aria-label="Close" data-modal-close="true"></a>
  </div>
  <div class="modal-body">
    {% block modal_body %}{% endblock %}
  </div>
</div>
